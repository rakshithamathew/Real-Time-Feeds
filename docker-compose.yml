services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-incident_feed}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-incident_feed}
      POSTGRES_DB: ${POSTGRES_DB:-incident_feed}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres-test:
    image: postgres:17-alpine
    profiles: [test]
    environment:
      POSTGRES_USER: incident_feed
      POSTGRES_PASSWORD: incident_feed
      POSTGRES_DB: incident_feed_test
    ports:
      - "127.0.0.1:5433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U incident_feed -d incident_feed_test"]
      interval: 2s
      timeout: 5s
      retries: 15

volumes:
  postgres_data:
